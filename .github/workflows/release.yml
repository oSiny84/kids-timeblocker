# 빌드해서 GitHub Release 로 올린다.
#
# 왜 CI 가 만드는가:
#   릴리즈 파일은 테스트를 통과한 커밋에서 나온 것이어야 한다.
#   손으로 만든 zip 을 올리면 "무엇으로 빌드했는지" 를 아무도 보증할 수 없다.
#   make-release.ps1 은 build.ps1 을 거치고, 테스트가 실패하면 zip 을 만들지 않는다.
#
# 두 가지로 돌릴 수 있다.
#   1. v* 태그를 푸시한다 (로컬에서 릴리즈할 때)
#   2. Actions 탭에서 Run workflow 로 태그 이름을 입력한다
#      태그가 없어도 된다. gh release create 가 지정한 커밋에 태그까지 만든다.
#
# 태그에 하이픈이 있으면 시험판(pre-release)으로 올린다.
#   v1.3.0        정식 릴리즈 ("최신 릴리즈" 로 잡힌다)
#   v1.3.0-rc.1   시험판 (잡히지 않는다)
#
# 릴리즈 생성은 러너에 들어 있는 gh 로 한다. 제3자 액션을 끌어오지 않는다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v1.3.0-rc.1). 하이픈이 있으면 시험판으로 올립니다.'
        required: true
        type: string

# gh release create 가 릴리즈와 태그를 만들 수 있어야 한다.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 태그 이름은 환경변수로 받는다. 스크립트에 직접 끼워넣으면
      # 입력에 따옴표가 섞였을 때 명령이 바뀔 수 있다.
      - name: 태그 결정
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          $tag = "$tag".Trim()

          # 형식을 확인한다. 엉뚱한 이름으로 릴리즈가 생기면 되돌리기가 번거롭다.
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "태그는 v1.2.3 또는 v1.2.3-rc.1 형식이어야 합니다. 받은 값: '$tag'"
          }

          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "릴리즈 태그: $tag"

      - name: .NET 8 SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 빌드 + 단위 테스트 + 게시
        shell: pwsh
        run: ./scripts/build.ps1

      # zip 이름에 태그를 그대로 쓴다. 시험판을 정식 버전으로 착각하지 않게 한다.
      # (v1.3.0-rc.1 -> TimeBlocker-1.3.0-rc.1.zip)
      - name: 설치용 zip 생성
        shell: pwsh
        run: ./scripts/make-release.ps1 -SkipBuild -Version ($env:TAG -replace '^v', '')

      - name: 릴리즈 올리기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem release/*.zip | Select-Object -First 1)
          if (-not $zip) { throw "릴리즈에 올릴 zip 을 찾지 못했습니다." }

          $lines = @(
            '## 막는 대상',
            '',
            '| 대상 | 텔레그램 이름 | 막는 방법 |',
            '|---|---|---|',
            '| YouTube | `youtube` (`yt`) | DNS |',
            '| Shorts | `shorts` (`sh`) | 쇼츠 제거 확장 강제 설치 (일반 영상은 그대로) |',
            '| Roblox | `roblox` (`rb`) | DNS + 방화벽 + 게임 종료 |',
            '| 서든어택 | `suddenattack` (`sa`, `서든`) | DNS + 방화벽 + 게임 종료 |',
            '',
            '차단 시간에 게임이 켜져 있으면 PC 화면에 경고를 띄우고 5분 뒤 종료합니다.',
            '자주 쓰는 명령: `status`, `block sa`, `auto sa`, `sa 30` (30분 허용). 전체 목록은 `help`.',
            '',
            '## 처음 설치',
            '',
            '1. 아래 zip 을 받아 압축을 풉니다',
            '2. `install.bat` 을 실행합니다 (게시자 확인 경고가 뜨면 "예" / "실행")',
            '3. Bot Token 과 User ID 를 입력합니다',
            '4. **"쇼츠도 차단할까요?"** 에 답합니다 (`Y` 면 쇼츠만 차단이 켜집니다)',
            '5. 설치가 끝나면 자동으로 점검(`doctor`)이 실행됩니다',
            '',
            '필요한 것: .NET 8 Desktop Runtime, Telegram Bot Token.',
            'zip 안의 `설치안내.txt` 에 더 자세히 적혀 있습니다.',
            '',
            '## 업데이트 (이미 설치된 PC)',
            '',
            '제거하지 않고 새 zip 의 `install.bat` 을 그대로 실행하면 됩니다.',
            'Bot Token / User ID / 쇼츠 질문은 **Enter 만 누르면 기존 설정이 그대로 유지**됩니다.',
            '설치 화면의 `설치된 버전` 과 텔레그램 `version` 으로 새 버전이 들어갔는지 확인하세요.',
            '',
            '## 쇼츠는 어떻게 막히나',
            '',
            '크롬 / 엣지 정책(`ExtensionInstallForcelist`)으로 쇼츠 제거 확장을',
            '**강제 설치**합니다. 강제 설치된 확장은 확장 목록에서 아이가 지울 수 없습니다.',
            '우회 경로인 시크릿 창 / 게스트 모드 / DoH 도 함께 막습니다.',
            '',
            '## 알아둘 점',
            '',
            '- 게임이 Windows 시작 프로그램에 등록돼 있으면, 게임을 켜지 않아도 백그라운드',
            '  프로세스 때문에 종료 경고가 뜰 수 있습니다. 작업 관리자 → 시작 프로그램에서',
            '  "사용 안 함" 으로 바꾸세요. (예: Roblox Game Client)',
            '- 서든어택은 설치 폴더를 고를 수 있습니다. 기본 위치(`C:\Nexon` 등)에 없으면',
            '  차단 시간에 한 번 실행될 때 경로를 알아내 방화벽 규칙을 만듭니다.',
            '- 쇼츠 확장은 웹스토어에서 받아오므로 **처음 적용될 때 인터넷이 필요**하고,',
            '  브라우저를 다시 시작한 뒤에 적용이 보입니다. 확장 버전은 고정할 수 없으니',
            '  가끔 `chrome://extensions` 에서 권한을 확인하세요.',
            '- 정책을 걸지 않은 다른 브라우저(Firefox 등)로 옮기면 쇼츠 차단이 무력화됩니다.',
            '',
            '자세한 내용은 README 14장에 적어 두었습니다.',
            '',
            '## 되돌리기',
            '',
            '- 쇼츠 차단만 끄기: 텔레그램 `policy off`',
            '- 게임 하나만 풀기: 텔레그램 `unblock sa` / `unblock roblox`',
            '- 전부 원래대로: `uninstall.bat`',
            '',
            '손으로 `reg add` 해서 넣어둔 `ExtensionInstallForcelist` 항목이 있으면',
            '**원래 설정으로 보고 건드리지 않습니다.** 그것까지 지우려면 직접 지우세요.',
            '',
            '```',
            'reg delete "HKLM\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist" /v "1" /f',
            '```'
          )

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $lines | Out-File -FilePath $notesPath -Encoding utf8

          # 이미 있는 릴리즈면 파일만 갈아끼운다. 같은 태그로 다시 돌릴 때 실패하지 않게 한다.
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "릴리즈가 이미 있습니다. 파일과 설명글을 갈아끼웁니다: $env:TAG"
            gh release upload $env:TAG $zip.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "릴리즈 파일 업로드 실패" }

            # 설명글을 고친 뒤 같은 태그로 다시 돌리면 이미 올라간 릴리즈의 설명도 바뀌게 한다.
            gh release edit $env:TAG --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "릴리즈 설명 갱신 실패" }
            exit 0
          }

          $ghArgs = @(
            'release', 'create', $env:TAG, $zip.FullName,
            '--title', $env:TAG,
            '--notes-file', $notesPath,
            '--target', $env:GITHUB_SHA
          )

          # 하이픈이 있는 태그는 시험판으로 올린다. (v1.3.0-rc.1)
          if ($env:TAG -like '*-*') {
            $ghArgs += '--prerelease'
            Write-Host "시험판(pre-release)으로 올립니다: $env:TAG"
          }
          else {
            Write-Host "정식 릴리즈로 올립니다: $env:TAG"
          }

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "릴리즈 생성 실패" }
